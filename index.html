const canvas = document.getElementById("view");
const ctx = canvas.getContext("2d");
let viewW = 300;
let viewH = 198;

function fitCanvas() {
  const ratio = viewW / viewH;
  let cssW = window.innerWidth;
  let cssH = cssW / ratio;
  if (cssH > window.innerHeight) {
    cssH = window.innerHeight;
    cssW = cssH * ratio;
  }
  const dpr = window.devicePixelRatio || 1;
  canvas.style.width = `${cssW}px`;
  canvas.style.height = `${cssH}px`;
  const bitmapW = Math.max(1, Math.round(cssW * dpr));
  const bitmapH = Math.max(1, Math.round(cssH * dpr));
  if (canvas.width !== bitmapW || canvas.height !== bitmapH) {
    canvas.width = bitmapW;
    canvas.height = bitmapH;
  }
  ctx.setTransform(canvas.width / viewW, 0, 0, canvas.height / viewH, 0, 0);

function sealText(payload) {
  let mix = 2166136261;
  const text = payload + "test-your-luck-seal-v1";
  for (let index = 0; index < text.length; index += 1) {
    mix ^= text.charCodeAt(index);
    mix = Math.imul(mix, 16777619);
  }
  return (mix >>> 0).toString(16).padStart(8, "0");
}

function applyProgress(saved) {
  rolls = Math.max(0, saved.rolls || 0);
  found = saved.found && typeof saved.found === "object" ? saved.found : {};
  money = Math.max(0, saved.money || 0);

function load() {
  const raw = localStorage.getItem(saveKey);
  if (!raw) return;
  let wrapped;
  try {
    wrapped = JSON.parse(raw);
  } catch (error) {
    return;
  }
  if (!wrapped || typeof wrapped !== "object") return;
  if (typeof wrapped.body === "string") {
    if (wrapped.seal !== sealText(wrapped.body)) return;
    try {
      const saved = JSON.parse(wrapped.body);
      if (saved && typeof saved === "object") applyProgress(saved);
    } catch (error) {
      return;
    }
    localStorage.setItem(saveKey + "-lock", "1");
    return;
  }
  if (localStorage.getItem(saveKey + "-lock")) return;
  applyProgress(wrapped);
  store();
}

      const data = await (await fetch(`${BOARD_ROOT}/${path}`)).json();

        player: path.slice(2),
      });

    rows.sort((a, b) => b.rarity - a.rarity);

function luckNow() {
  return Date.now() < potionUntil ? 2 : 1;
}

function speedNow() {
  return Date.now() < speedUntil ? 2 : 1;

const wheelWeights = RARITIES.map((rarity) => 1 / rarity.rarity);
const wheelTotal = wheelWeights.reduce((sum, weight) => sum + weight, 0);
RARITIES.forEach((rarity) => {
  rarity.chance = `1 in ${Math.max(1, Math.round(wheelTotal * rarity.rarity)).toLocaleString("en-US")}`;
});

function spinWheel() {
  let mark = Math.random() * wheelTotal;
  for (let index = 0; index < RARITIES.length; index += 1) {
    mark -= wheelWeights[index];
    if (mark <= 0) return RARITIES[index];
  }
  return RARITIES[RARITIES.length - 1];
}

function luckSpins(boost) {
  const scaled = boost * CLOVER_LUCK[Math.min(CLOVER_LUCK.length - 1, Math.max(0, cloverTier))];
  let spins = Math.floor(scaled);
  if (Math.random() < scaled - spins) spins += 1;
  return Math.max(1, spins);
}

function gamblerPace() {
  if (rolls >= 10000) return 1.8;
  if (rolls >= 4000) return 1.7;
  if (rolls >= 2000) return 1.6;
  if (rolls >= 1600) return 1.55;
  if (rolls >= 800) return 1.5;
  if (rolls >= 400) return 1.4;
  if (rolls >= 200) return 1.3;
  if (rolls >= 100) return 1.2;
  return 1;
}

function gamblerName() {
  if (rolls >= 10000) return "apex gambler +80%";
  if (rolls >= 4000) return "turbo gambler +70%";
  if (rolls >= 2000) return "hyper gambler +60%";
  if (rolls >= 1600) return "max gambler +55%";
  if (rolls >= 800) return "ultra gambler +50%";
  if (rolls >= 400) return "rapid fire +40%";
  if (rolls >= 200) return "spam clicker +30%";
  if (rolls >= 100) return "speedy gambler +20%";
  return "";
}

function pickRarity(boost = luckNow()) {
  const spins = luckSpins(boost);
  let best = spinWheel();
  for (let spin = 1; spin < spins; spin += 1) {
    const rolled = spinWheel();
    if (rolled.rarity > best.rarity) best = rolled;
  }
  return best;
}

function pointerPos(event) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (event.clientX - rect.left) * (viewW / rect.width),
    y: (event.clientY - rect.top) * (viewH / rect.height),
  };
}

function ensureAudio() {
  if (audioCtx || location.protocol === "file:") return;
  const Ctx = window.AudioContext || window.webkitAudioContext;
  audioCtx = new Ctx();
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 256;
  freq = new Uint8Array(analyser.frequencyBinCount);
  analyser.connect(audioCtx.destination);
  [combo, ...songs].forEach((audio) => {
    const source = audioCtx.createMediaElementSource(audio);
    source.connect(analyser);
  });
}

function resumeAudio() {
  ensureAudio();
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
}

function level() {
  if (!analyser) return 0;
  analyser.getByteFrequencyData(freq);
  let sum = 0;
  for (let index = 0; index < freq.length; index += 1) sum += freq[index];
  return Math.min(1, (sum / freq.length) / 150);
}

      const board = document.createElement("canvas");
      board.width = image.width;
      board.height = height;
      const pen = board.getContext("2d");
      pen.drawImage(image, 0, 0);
      pen.globalCompositeOperation = "source-in";
      pen.fillStyle = "rgb(255, 210, 42)";
      pen.fillRect(0, 0, board.width, board.height);
      starImages.push(board);
    };
    image.src = src;
  });
}

function burst(rarity) {
  const color = rarity.color;
  const dots = rarity.id === "epic" ? 34 : 18;
  for (let index = 0; index < dots; index += 1) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1 + Math.random() * 3.2;
    particles.push({
      kind: "dot",
      x: GAME_W / 2,
      y: 130,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 1.3,
      life: 0.65 + Math.random() * 0.45,
      color: color.map((channel) => Math.max(0, Math.min(255, channel + (Math.random() * 64 - 24)))),
      r: 2 + Math.random() * 3,
    });
  }
  if (rarity.id === "epic") {
    for (let index = 0; index < 10; index += 1) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 0.8 + Math.random() * 2.4;
      particles.push({
        kind: "star",
        x: GAME_W / 2,
        y: 130,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 1.1,
        life: 0.8 + Math.random() * 0.45,
        color: Math.random() < 0.7 ? color : [236, 214, 255],
        r: 7 + Math.random() * 7,
        rot: Math.random() * Math.PI * 2,
        spin: (Math.random() - 0.5) * 0.24,
      });
    }
  }
  if (rarity.id === "legendary" && starImages.length) {
    for (let index = 0; index < 18; index += 1) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 1 + Math.random() * 3.8;
      particles.push({
        kind: "doodle",
        x: GAME_W / 2,
        y: 130,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 1.6,
        life: 1 + Math.random() * 0.45,
        which: Math.floor(Math.random() * starImages.length),
        scrib: performance.now(),
        frame: Math.floor(Math.random() * 6),
        size: 34 + Math.random() * 34,
        rot: Math.random() * Math.PI * 2,
      });
    }
  }
}

function beginRoll(auto = false) {
  if (spinning || bestiaryOpen || shopOpen || mode !== "game" || performance.now() < rollReady) return;
  if (auto) {
    if (money < 3) return;
    money -= 3;
  }
  let boost = luckNow();
  if (megaLeft > 0) {
    megaLeft -= 1;
    boost = 100;
    store();
  }
  boost *= nextMulti;
  nextMulti = 1;
  const result = pickRarity(boost);
  const count = 40;
  rollItems = Array.from({ length: count - 2 }, () => pickRarity(boost));
  rollItems.push(result);
  rollTimes = [];
  const pace = speedNow() * 1.25 * gamblerPace();
  rollPad = 0.06 / pace;
  let moment = 0.14 / pace;
  for (let index = 0; index < count; index += 1) {
    const along = index / (count - 1);
    moment += (0.022 + (0.5 - 0.022) * (along ** 2.8)) / pace;
    rollTimes.push(moment);
  }
  rollStarted = performance.now();
  rollIndex = -1;
  showItem = null;
  showZoom = 1;
  showAlpha = 255;
  landZoom = 1;
  landZoomTarget = 1;
  peaceReveal = 1;
  particles = [];
  spinning = true;
}

function finishRoll() {
  spinning = false;
  rollReady = performance.now() + 500;
  const result = rollItems[rollItems.length - 1];
  lastResult = result;
  rolls += 1;
  money += result.rarity;
  payoutShown = result.rarity;
  payoutUntil = performance.now() + 1400;
  if (!found[result.id]) found[result.id] = { count: 0, first: rolls };
  found[result.id].count += 1;
  if (result.rarity > bestRarity) {
    bestRarity = result.rarity;
    bestId = result.id;
    store();
    pushBest();
  } else {
    store();
  }
  nextMulti *= NEXT_MULTI[result.id] || 1;
  if (result.id === "la peace") {
    peaceReveal = 0;
    peaceBurst = false;
  } else {
    burst(result);
  }
  landZoomTarget = result.id === "epic" ? 1.18 : result.id === "legendary" ? 1.36 : 1;
}

function roundButton(box, label, held, font) {
  ctx.beginPath();
  ctx.roundRect(box.x, box.y, box.w, box.h, 6);
  ctx.fillStyle = held ? "#969696" : "#ffffff";
  ctx.strokeStyle = "#000";
  ctx.lineWidth = 2;
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = "#000";
  ctx.font = font;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(label, box.x + box.w / 2, box.y + box.h / 2);
}

const PHOTO_SETS = 5;
function photoSet(id) {
  let total = 0;
  for (const char of id) total += char.codePointAt(0);
  return `set-${(total % PHOTO_SETS) + 1}`;
}

const photos = {};
RARITIES.forEach((rarity) => {
  const image = new Image();
  image.src = `photos/${photoSet(rarity.id)}/${encodeURIComponent(rarity.id)}.jpg`;
  photos[rarity.id] = image;
});

function paintPhoto(rarity, x, y, size) {
  const photo = photos[rarity.id];
  if (!photo || !photo.complete || !photo.naturalWidth) return false;
  const side = Math.min(photo.naturalWidth, photo.naturalHeight);
  const sx = (photo.naturalWidth - side) / 2;
  const sy = (photo.naturalHeight - side) / 2;
  ctx.save();
  ctx.beginPath();
  ctx.roundRect(x, y, size, size, size * 0.1);
  ctx.clip();
  ctx.drawImage(photo, sx, sy, side, side, x, y, size, size);
  ctx.restore();
  return true;
}

function paintNamed(rarity, scale, alpha) {
  ctx.save();
  ctx.translate(GAME_W / 2, 118);
  ctx.scale(scale, scale);
  ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
  const hasPhoto = paintPhoto(rarity, -48, -106, 96);
  const nameY = hasPhoto ? 14 : 0;
  ctx.fillStyle = css(rarity.color);
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.font = "46px Arial";
  ctx.fillText(rarity.name, 0, nameY);
  ctx.font = "22px Arial";
  const oddsWidth = Math.max(ctx.measureText(rarity.odds).width, ctx.measureText(rarity.chance).width) * scale;
  const oddsY = 118 + (nameY + 44) * scale;
  const oddsOver = Math.abs(pointer.x - GAME_W / 2) <= oddsWidth / 2 + 6 && Math.abs(pointer.y - oddsY) <= 16 * scale;
  ctx.fillText(oddsOver ? rarity.chance : rarity.odds, 0, nameY + 44);
  ctx.restore();
}

function starPath(x, y, radius, rot) {
  ctx.beginPath();
  for (let index = 0; index < 10; index += 1) {
    const angle = rot + index * Math.PI / 5 - Math.PI / 2;
    const arm = index % 2 === 0 ? radius : radius * 0.42;
    const px = x + Math.cos(angle) * arm;
    const py = y + Math.sin(angle) * arm;
    if (index === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.closePath();
}

function drawDoodle(bit) {
  const image = starImages[bit.which];
  if (!image) return;
  const slices = 8;
  const sliceH = image.height / slices;
  const drawH = bit.size / slices;
  ctx.save();
  ctx.translate(bit.x, bit.y);
  ctx.rotate(bit.rot);
  ctx.globalAlpha = Math.max(0, bit.life);
  for (let index = 0; index < slices; index += 1) {
    const wobble = Math.sin(index * 1.4 + bit.frame) * 3.2;
    ctx.drawImage(
      image,
      0, sliceH * index, image.width, sliceH + 1,
      -bit.size / 2 + wobble, -bit.size / 2 + index * drawH, bit.size, drawH + 1,
    );
  }
  ctx.restore();
}

const barHistory = Array.from({ length: 60 }, () => 0.04);
let barClock = 0;

function paintBars() {
  const count = 60;
  const slot = canvas.width / count;
  const bottom = canvas.height - 1;
  const maxH = 86;
  for (let index = 0; index < count; index += 1) {
    const sample = barHistory[index];
    const height = Math.max(4, maxH * (0.05 + 0.95 * sample));
    const x = index * slot;
    const y = bottom - height;
    const alpha = (32 + 36 * sample) / 255;
    const barW = Math.max(2, slot - 1);
    ctx.fillStyle = `rgba(206, 142, 36, ${alpha})`;
    ctx.fillRect(x, y, barW, height);
    ctx.fillStyle = `rgba(238, 198, 96, ${Math.min(1, alpha + 18 / 255)})`;
    ctx.fillRect(x, y, barW, 2);
  }
}

function paintWords(now) {
  const zoom = 1 + 0.2 * loudness;
  ctx.save();
  ctx.translate(INTRO_W / 2, STAGE_H / 2);
  ctx.scale(zoom, zoom);
  ctx.translate(-INTRO_W / 2, -STAGE_H / 2);
  WORDS.forEach((word, index) => {
    const start = Math.max(0, BEATS[index] - word.ms);
    if (now < start) return;
    const t = Math.min(1, (now - start) / word.ms);
    const eased = 1 - (1 - t) ** 3;
    const y = (word.y - word.drop) + word.drop * eased;
    const from = word.scale || 1;
    const scale = from + (1 - from) * eased;
    if (t === 1 && !landed[index]) {
      landed[index] = true;
      flash = Math.max(flash, word.big ? 220 : 96);
    }
    ctx.save();
    ctx.translate(word.x, y);
    ctx.rotate(word.angle * Math.PI / 180);
    ctx.scale(scale, scale);
    ctx.fillStyle = word.color;
    ctx.font = `${word.bold ? "bold " : ""}${word.size}px "Comic Sans MS", "Comic Sans", cursive`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(word.text, 0, 0);
    ctx.restore();
  });
  ctx.restore();
}

function paintIntro(now) {
  ctx.fillStyle = "#141414";
  ctx.fillRect(0, 0, INTRO_W, INTRO_H);
  if (introBegun) paintWords(now - introStart);
  else {
    ctx.fillStyle = "#f4f4f4";
    ctx.font = "16px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("click", INTRO_W / 2, STAGE_H / 2);
  }
  paintBars();
  if (startAlpha > 0) {
    ctx.globalAlpha = startAlpha / 255;
    roundButton(START_BOX, "start", heldStart, "12px Arial");
    ctx.globalAlpha = 1;
  }
  if (flash > 0) {
    ctx.fillStyle = `rgba(255,255,255,${flash / 255})`;
    ctx.fillRect(0, 0, INTRO_W, INTRO_H);
  }
}

function stripPos(elapsed) {
  const target = Math.max(0, rollItems.length - 2);
  if (!rollTimes.length) return target;
  const last = rollTimes[rollTimes.length - 1];
  if (elapsed < last) {
    const t = Math.max(0, elapsed / last);
    return target * (1 - (1 - t) ** 2.6);
  }
  if (elapsed < last + rollOver) {
    let t = (elapsed - last) / (rollOver || 1);
    t = 1 - (1 - t) ** 2;
    return target + 0.88 * t;
  }
  if (elapsed < last + rollOver + rollBack) {
    let t = (elapsed - last - rollOver) / (rollBack || 1);
    t = t * t * (3 - 2 * t);
    return target + 0.88 * (1 - t);
  }
  return target;
}

function paintRoll() {
  const elapsed = spinning ? (performance.now() - rollStarted) / 1000 : 0;
  const scale = showZoom * (spinning ? 1 : landZoom);
  const alpha = (spinning ? showAlpha : 255) / 255;
  if (spinning && rollIndex < 0 && lastResult) {
    paintNamed(lastResult, 1, Math.max(0, 1 - elapsed / 0.14));
    return;
  }
  const shown = spinning && showItem ? showItem : lastResult;
  if (!shown) {
    ctx.fillStyle = "#dcdcdc";
    ctx.font = "46px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("roll", GAME_W / 2, 136);
    return;
  }
  if (shown.id === "la peace" && spinning) {
    paintNamed(DIAMOND, scale, alpha);
    return;
  }
  if (shown.id === "la peace") {
    paintNamed(DIAMOND, scale, alpha * (1 - peaceReveal));
    paintNamed(shown, scale, alpha * peaceReveal);
    return;
  }
  paintNamed(shown, scale, alpha);
}

function paintNamed(rarity, scale, alpha) {
  ctx.save();

  const oddsY = 118 + (nameY + 44) * scale;
  const oddsOver = Math.abs(pointer.x - GAME_W / 2) <= oddsWidth / 2 + 6 && Math.abs(pointer.y - oddsY) <= 16 * scale;

function paintParticles() {
  particles.forEach((bit) => {
    ctx.globalAlpha = Math.max(0, bit.life);
    if (bit.kind === "dot") {
      ctx.fillStyle = css(bit.color);
      ctx.beginPath();
      ctx.arc(bit.x, bit.y, bit.r, 0, Math.PI * 2);
      ctx.fill();
    } else if (bit.kind === "star") {
      ctx.fillStyle = css(bit.color);
      starPath(bit.x, bit.y, bit.r, bit.rot);
      ctx.fill();
    } else {
      drawDoodle(bit);
    }
    ctx.globalAlpha = 1;
  });
}

let last = performance.now();
let wordsDoneAt = 0;
let prevHeard = 0;
let flashCool = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  const heard = level();
  loudness += (heard > loudness ? 0.5 : 0.14) * (heard - loudness);
  barClock += dt * 1000;
  if (barClock >= 28) {
    barClock = 0;
    barHistory.shift();
    barHistory.push(Math.max(0.04, heard));
  }
  if (mode === "intro" && heard > 0.62 && heard - prevHeard > 0.16 && flashCool <= 0) {
    flash = Math.max(flash, 70);
    flashCool = 8;
  }
  flashCool = Math.max(0, flashCool - dt * 60);
  prevHeard = heard;

  if (mode === "intro") {
    const elapsed = introBegun ? now - introStart : 0;
    if (introBegun && landed.every(Boolean)) {
      if (!wordsDoneAt) wordsDoneAt = now + 280;
      if (now >= wordsDoneAt) {
        startAlpha = Math.min(255, startAlpha + dt * 875);
        if (startAlpha >= 255) {
          introDone = true;
          if (!musicStarted) startPlaylist();
        }
      }
    }
    flash = Math.max(0, flash - dt * 1100);
    paintIntro(elapsed);
  } else {
    if (spinning && rollTimes.length) {
      const elapsed = (now - rollStarted) / 1000;
      while (rollIndex + 1 < rollItems.length && elapsed >= rollTimes[rollIndex + 1]) {
        rollIndex += 1;
        showItem = rollItems[rollIndex];
        showZoom = 1.07;
        showAlpha = 60;
        playTick();
      }
      if (rollIndex >= rollItems.length - 1 && elapsed >= rollTimes[rollItems.length - 1] + rollPad) finishRoll();
    }
    if (autoclickerOn && !spinning && !bestiaryOpen && !shopOpen && !boardOpen && performance.now() >= rollReady + 1500 && money >= 3) beginRoll(true);
    showZoom += (1 - showZoom) * Math.min(1, dt * 26);
    showAlpha = Math.min(255, showAlpha + dt * 3000);
    landZoom += (landZoomTarget - landZoom) * Math.min(1, dt * 9);
    if (!spinning && lastResult && lastResult.id === "la peace" && peaceReveal < 1) {
      peaceReveal = Math.min(1, peaceReveal + dt * 1.1);
      if (peaceReveal > 0.45 && !peaceBurst) {
        peaceBurst = true;
        burst(lastResult);
      }
    }
    particles.forEach((bit) => {
      bit.x += bit.vx;
      bit.y += bit.vy;
      bit.vy += 0.035;
      bit.life -= dt;
      if (bit.kind === "star") bit.rot += bit.spin;
      if (bit.kind === "doodle" && now - bit.scrib >= 100) {
        bit.frame += 1;
        bit.scrib = now;
      }
    });
    particles = particles.filter((bit) => bit.life > 0);
    paintGame();
  }
  requestAnimationFrame(frame);
}

canvas.addEventListener("pointermove", (event) => {
  const pos = pointerPos(event);
  pointer.x = pos.x;
  pointer.y = pos.y;
});

canvas.addEventListener("pointerdown", (event) => {
  resumeAudio();
  if (!introBegun) beginIntro();
  else if (!musicStarted && introDone) startPlaylist();
  else if (!musicStarted && combo.paused) playCombo();
  const pos = pointerPos(event);
  pointer = { ...pos, down: true };
  const name = buttonAt(pos.x, pos.y);
  if (name === "start") heldStart = true;
  else heldName = name;
});

canvas.addEventListener("pointerup", (event) => {
  const pos = pointerPos(event);
  const name = buttonAt(pos.x, pos.y);
  if (heldStart && name === "start") enterGame();
  if (heldName && name === heldName) {
    if (name === "roll") beginRoll();
    if (name === "bestiary") {
      bestiaryOpen = true;
      shopOpen = false;
      boardOpen = false;
      bestiaryScroll = 0;
    }
    if (name === "shop") {
      shopOpen = true;
      bestiaryOpen = false;
      boardOpen = false;
    }
    if (name === "board") {
      boardOpen = true;
      bestiaryOpen = false;
      shopOpen = false;
      boardScroll = 0;
      pullBoard();
    }
    if (name === "name") askName();
    if (name === "reset") tapReset();
    if (name === "buy") buyLuck();
    if (name === "buy-speed") buySpeed();
    if (name === "buy-mega") buyMega();
    if (name === "buy-clover") buyClover();
    if (name === "buy-auto") buyAutoclicker();
    if (name === "back") {
      bestiaryOpen = false;
      shopOpen = false;
      boardOpen = false;
    }
  }
  heldStart = false;
  heldName = null;
  pointer.down = false;
});

canvas.addEventListener("wheel", (event) => {
  if (mode === "game" && (bestiaryOpen || boardOpen)) {
    if (boardOpen) boardScroll = Math.max(0, boardScroll + event.deltaY * 0.4);
    else bestiaryScroll = Math.max(0, bestiaryScroll + event.deltaY * 0.4);
    event.preventDefault();
  }
}, { passive: false });

loadStars();
fitCanvas();
window.addEventListener("resize", fitCanvas);
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
